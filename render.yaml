services:
  - type: web
    name: jarvis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JARVIS_REQUIRE_AUTH
        value: "true"
      - key: JARVIS_ACCESS_TOKEN
        generateValue: true
